spring.application.name=taches-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tachesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taches_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
